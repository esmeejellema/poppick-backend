spring.application.name=poppick-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#code tijdelijk testen zonder verbinding met db
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
#wijzigt niks aan database maar checkt wel of tabellen overeenkomen
spring.sql.init.mode=never
#voer geen sql scripts uit (data.sql)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authentication=DEBUG

poppick.app.jwtSecret=U29tZVN1cGVyU2VjdXJlU2VjcmV0S2V5Rm9ySHM1MTJBbGdvcml0aG0xMjM0NTZBTkRTRUZHMDEyMzQ1Njc4OTBhYmNkZWY=
poppick.app.jwtExpirationMs=86400000
# Max file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=file:uploads/

